<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="940" viewBox="0 0 1480 940" font-family="Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06281f"/>
      <stop offset="1" stop-color="#04130f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- PCB substrate -->
  <rect x="0" y="0" width="1480" height="940" fill="url(#board)"/>
  <rect x="14" y="14" width="1452" height="912" fill="none" stroke="#0c6b4a" stroke-width="2" rx="10"/>
  <!-- mounting holes -->
  <g fill="#0a3a2a" stroke="#13885c" stroke-width="2">
    <circle cx="40" cy="40" r="9"/><circle cx="1440" cy="40" r="9"/>
    <circle cx="40" cy="900" r="9"/><circle cx="1440" cy="900" r="9"/>
  </g>

  <text x="40" y="70" fill="#7CFFB2" font-size="26" font-weight="bold" letter-spacing="2">SILVER ENGINE — BOARD SCHEMATIC</text>
  <text x="40" y="94" fill="#3f9d75" font-size="14">Support heart (PITR) superimposed on the real circuit · solid = built · red dashed = missing</text>

  <!-- ================= ELECTRICAL (LOGIC) SECTION ================= -->
  <text x="40" y="140" fill="#2f8f6a" font-size="13" letter-spacing="3">▲ ELECTRICAL  ·  pure logic / no moving parts</text>

  <!-- traces (copper) -->
  <g stroke="#1fae74" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M150 240 H300"/>
    <path d="M430 240 H560"/>
    <path d="M690 240 H840"/>
    <path d="M960 240 H1120"/>
    <path d="M1180 300 V420"/> <!-- down to store -->
  </g>

  <!-- 1. POWER SOURCE: bytes on disk -->
  <g>
    <circle cx="110" cy="240" r="34" fill="#08231a" stroke="#1fae74" stroke-width="3"/>
    <text x="110" y="236" fill="#9affc9" font-size="13" text-anchor="middle">BYTES</text>
    <text x="110" y="252" fill="#9affc9" font-size="13" text-anchor="middle">ON DISK</text>
    <text x="110" y="300" fill="#5fcf9a" font-size="11" text-anchor="middle">source charge</text>
  </g>

  <!-- 2. CRYSTAL: SHA-256 reference -->
  <g>
    <rect x="300" y="206" width="130" height="68" rx="6" fill="#0a3a2a" stroke="#7CFFB2" stroke-width="3"/>
    <line x1="318" y1="218" x2="318" y2="262" stroke="#7CFFB2" stroke-width="2"/>
    <rect x="332" y="218" width="66" height="44" fill="#063226" stroke="#7CFFB2" stroke-width="2"/>
    <line x1="412" y1="218" x2="412" y2="262" stroke="#7CFFB2" stroke-width="2"/>
    <text x="365" y="244" fill="#bfffe0" font-size="12" text-anchor="middle">XTAL</text>
    <text x="365" y="296" fill="#7CFFB2" font-size="11" text-anchor="middle">SHA-256 REF</text>
    <text x="365" y="310" fill="#4fbf8a" font-size="10" text-anchor="middle">fingerprint.js</text>
    <text x="365" y="190" fill="#cfeede" font-size="10" text-anchor="middle">Identity heart · the clock</text>
  </g>

  <!-- 3. OP-AMP comparator -->
  <g>
    <polygon points="560,210 560,270 640,240" fill="#0a3a2a" stroke="#1fae74" stroke-width="3"/>
    <text x="585" y="244" fill="#bfffe0" font-size="16" text-anchor="middle">▷</text>
    <text x="600" y="300" fill="#5fcf9a" font-size="11" text-anchor="middle">COMPARATOR</text>
    <text x="600" y="314" fill="#4fbf8a" font-size="10" text-anchor="middle">verifyTarget / verifySnapshot</text>
    <text x="600" y="190" fill="#cfeede" font-size="10" text-anchor="middle">Integrity heart · op-amp</text>
  </g>

  <!-- 4. MOSFET gate -->
  <g>
    <line x1="840" y1="210" x2="840" y2="270" stroke="#1fae74" stroke-width="3"/>
    <line x1="852" y1="216" x2="852" y2="264" stroke="#1fae74" stroke-width="3"/>
    <line x1="852" y1="228" x2="900" y2="228" stroke="#1fae74" stroke-width="3"/>
    <line x1="852" y1="252" x2="900" y2="252" stroke="#1fae74" stroke-width="3"/>
    <line x1="816" y1="240" x2="840" y2="240" stroke="#1fae74" stroke-width="3"/>
    <text x="868" y="300" fill="#5fcf9a" font-size="11" text-anchor="middle">GATE</text>
    <text x="868" y="314" fill="#4fbf8a" font-size="10" text-anchor="middle">if(!ok) throw</text>
    <text x="868" y="190" fill="#cfeede" font-size="10" text-anchor="middle">blocks flow when verify low</text>
  </g>

  <!-- 5. CAPACITOR BANK: snapshot store -->
  <g>
    <text x="1180" y="200" fill="#cfeede" font-size="10" text-anchor="middle">Support heart · reservoir</text>
    <line x1="1120" y1="240" x2="1240" y2="240" stroke="#1fae74" stroke-width="3"/>
    <!-- cap A -->
    <line x1="1150" y1="222" x2="1150" y2="258" stroke="#9affc9" stroke-width="4"/>
    <line x1="1166" y1="222" x2="1166" y2="258" stroke="#9affc9" stroke-width="4"/>
    <!-- cap B -->
    <line x1="1206" y1="222" x2="1206" y2="258" stroke="#9affc9" stroke-width="4"/>
    <line x1="1222" y1="222" x2="1222" y2="258" stroke="#9affc9" stroke-width="4"/>
    <text x="1158" y="282" fill="#7CFFB2" font-size="11" text-anchor="middle">snap A</text>
    <text x="1214" y="282" fill="#7CFFB2" font-size="11" text-anchor="middle">snap B</text>
    <text x="1186" y="420" fill="#5fcf9a" font-size="11" text-anchor="middle">SNAPSHOT STORE  .pitr/</text>
    <rect x="1110" y="320" width="150" height="60" rx="6" fill="#0a3a2a" stroke="#1fae74" stroke-width="2"/>
    <text x="1185" y="356" fill="#bfffe0" font-size="12" text-anchor="middle">⎓ charged states</text>
  </g>

  <!-- ===== MISSING (red dashed overlay) ===== -->
  <g stroke="#ff5a5a" stroke-width="3" fill="none" stroke-dasharray="9 7">
    <!-- missing DIODE: signature root of trust, between store and comparator -->
    <path d="M1110 350 H700 V270"/>
    <!-- missing COMPARE trace between cap A and cap B -->
    <path d="M1158 300 q28 40 56 0"/>
    <!-- missing series CHAIN link under caps -->
    <path d="M1150 470 H1240"/>
    <!-- missing CLUTCH at the boundary -->
    <path d="M600 330 V470"/>
  </g>
  <!-- diode symbol on the missing root-of-trust line -->
  <g>
    <polygon points="892,360 892,340 912,350" fill="none" stroke="#ff5a5a" stroke-width="3"/>
    <line x1="912" y1="338" x2="912" y2="362" stroke="#ff5a5a" stroke-width="3"/>
    <text x="902" y="392" fill="#ff8a8a" font-size="11" text-anchor="middle">⨯ MISSING DIODE</text>
    <text x="902" y="406" fill="#ff8a8a" font-size="10" text-anchor="middle">signature / root of trust</text>
  </g>
  <text x="1186" y="318" fill="#ff8a8a" font-size="10" text-anchor="middle">⨯ no compare A↔B</text>
  <text x="1195" y="490" fill="#ff8a8a" font-size="10" text-anchor="middle">⨯ no backward chain link</text>

  <!-- ================= BOUNDARY ================= -->
  <line x1="40" y1="520" x2="1440" y2="520" stroke="#ffd23f" stroke-width="2.5" stroke-dasharray="3 6"/>
  <text x="44" y="514" fill="#ffd23f" font-size="12" letter-spacing="2">ELECTRO-MECHANICAL BOUNDARY — fast logic meets slow actuators (most fragile joint)</text>
  <text x="600" y="455" fill="#ff8a8a" font-size="10" text-anchor="middle">⨯ MISSING CLUTCH / interlock</text>
  <text x="600" y="468" fill="#ff8a8a" font-size="10" text-anchor="middle">decide → actuate with no staging</text>

  <!-- ================= MECHANICAL SECTION ================= -->
  <text x="40" y="560" fill="#9a7f2f" font-size="13" letter-spacing="3">▼ MECHANICAL  ·  actuators that move bytes to the platter</text>

  <g stroke="#caa53a" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M150 660 H360"/>
    <path d="M520 660 H760"/>
    <path d="M920 660 H1120"/>
  </g>

  <!-- actuator: writeFileSync (solenoid coil) -->
  <g>
    <rect x="360" y="624" width="160" height="72" rx="6" fill="#241d06" stroke="#ffd23f" stroke-width="3"/>
    <path d="M372 660 q10 -16 20 0 q10 -16 20 0 q10 -16 20 0 q10 -16 20 0" stroke="#ffd23f" stroke-width="3" fill="none"/>
    <text x="440" y="690" fill="#ffe98a" font-size="11" text-anchor="middle">fs.writeFileSync</text>
    <text x="440" y="612" fill="#e8d79a" font-size="10" text-anchor="middle">SOLENOID · write actuator</text>
  </g>

  <!-- actuator: rmSync (relay) -->
  <g>
    <rect x="760" y="624" width="160" height="72" rx="6" fill="#241d06" stroke="#ffd23f" stroke-width="3"/>
    <line x1="784" y1="690" x2="820" y2="640" stroke="#ffd23f" stroke-width="3"/>
    <circle cx="784" cy="690" r="4" fill="#ffd23f"/><circle cx="896" cy="640" r="4" fill="#ffd23f"/>
    <text x="840" y="690" fill="#ffe98a" font-size="11" text-anchor="middle">fs.rmSync</text>
    <text x="840" y="612" fill="#e8d79a" font-size="10" text-anchor="middle">RELAY · prune actuator</text>
  </g>

  <!-- feedback sensor -->
  <g>
    <circle cx="1180" cy="660" r="36" fill="#241d06" stroke="#7CFFB2" stroke-width="3"/>
    <text x="1180" y="656" fill="#bfffe0" font-size="11" text-anchor="middle">FEEDBACK</text>
    <text x="1180" y="672" fill="#bfffe0" font-size="11" text-anchor="middle">SENSOR</text>
    <text x="1180" y="716" fill="#5fcf9a" font-size="10" text-anchor="middle">verifyTarget read-back</text>
  </g>
  <!-- feedback wire back up to logic -->
  <path d="M1180 624 V540" stroke="#7CFFB2" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <text x="1192" y="560" fill="#5fcf9a" font-size="10">closes the loop ✓</text>

  <!-- missing per-actuator sensors -->
  <g stroke="#ff5a5a" stroke-width="2.5" fill="none" stroke-dasharray="6 6">
    <path d="M440 624 V560"/>
    <path d="M840 624 V560"/>
  </g>
  <text x="440" y="600" fill="#ff8a8a" font-size="9" text-anchor="middle">⨯ no per-write limit switch</text>
  <text x="840" y="600" fill="#ff8a8a" font-size="9" text-anchor="middle">⨯ no per-write limit switch</text>
  <text x="640" y="744" fill="#ff8a8a" font-size="10" text-anchor="middle">⨯ MISSING: executable-bit / permission / symlink fidelity (mechanical tolerance)</text>

  <!-- ground -->
  <g stroke="#1fae74" stroke-width="3">
    <line x1="110" y1="660" x2="110" y2="810"/>
    <line x1="86" y1="810" x2="134" y2="810"/>
    <line x1="94" y1="822" x2="126" y2="822"/>
    <line x1="102" y1="834" x2="118" y2="834"/>
  </g>
  <text x="110" y="858" fill="#5fcf9a" font-size="10" text-anchor="middle">GND · disk</text>

  <!-- ================= LEGEND ================= -->
  <rect x="1040" y="788" width="400" height="120" rx="8" fill="#031410" stroke="#0c6b4a" stroke-width="2"/>
  <text x="1060" y="812" fill="#7CFFB2" font-size="13" font-weight="bold">LEGEND</text>
  <line x1="1060" y1="832" x2="1100" y2="832" stroke="#1fae74" stroke-width="3"/>
  <text x="1110" y="836" fill="#bfe9d4" font-size="11">built &amp; verified (in git history)</text>
  <line x1="1060" y1="856" x2="1100" y2="856" stroke="#ff5a5a" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="1110" y="860" fill="#ff9a9a" font-size="11">missing — diode / trace / clutch</text>
  <line x1="1060" y1="880" x2="1100" y2="880" stroke="#ffd23f" stroke-width="3"/>
  <text x="1110" y="884" fill="#e8d79a" font-size="11">mechanical actuator path</text>
</svg>
